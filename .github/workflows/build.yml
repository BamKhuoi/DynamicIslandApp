name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cài đặt XcodeGen
      run: brew install xcodegen

    - name: Tạo file Xcode Project
      run: xcodegen generate

    - name: Build ứng dụng (Bỏ qua Code Signing)
      run: |
        xcodebuild clean build \
          -project DynamicIslandApp.xcodeproj \
          -scheme DynamicIslandApp \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          VALIDATE_WORKSPACE=NO \
          -derivedDataPath build

    - name: Đóng gói thành file IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DynamicIslandApp.app Payload/
        mkdir -p Payload/DynamicIslandApp.app/PlugIns
        cp -r build/Build/Products/Release-iphoneos/DynamicIslandWidget.appex Payload/DynamicIslandApp.app/PlugIns/
    
        # Tự động tạo file Info.plist cho Widget để Sideloadly nhận diện
        cat <<EOF > Payload/DynamicIslandApp.app/PlugIns/DynamicIslandWidget.appex/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
             <key>CFBundleIdentifier</key>
             <string>com.hoanglinh.DynamicIslandApp.DynamicIslandWidget</string>
             <key>CFBundleName</key>
             <string>DynamicIslandWidget</string>
             <key>CFBundleExecutable</key>
             <string>DynamicIslandWidget</string>
             <key>CFBundleVersion</key>
             <string>1</string>
             <key>CFBundleShortVersionString</key>
             <string>1.0</string>
             <key>CFBundlePackageType</key>
             <string>XPC!</string>
             <key>NSExtension</key>
             <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.widgetkit-extension</string>
             </dict>
        </dict>
        </plist>
        EOF
    
        zip -r DynamicIslandApp.ipa Payload

    - name: Tải file IPA lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DynamicIslandApp-IPA
        path: DynamicIslandApp.ipa